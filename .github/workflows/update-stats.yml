name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_1 }}

      - name: Update stats cards cache
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_1 }}
          script: |
            console.log('Stats token active — private repos and org data included');
